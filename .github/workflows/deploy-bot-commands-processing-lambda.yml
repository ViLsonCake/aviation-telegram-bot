name: Deploy bot-commands-processing-lambda

on:
  push:
    branches:
      - main
    paths:
      - 'bot-commands-processing-lambda/**'
      - '.github/workflows/deploy-bot-commands-processing-lambda.yml'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JAR
        working-directory: bot-commands-processing-lambda
        run: ./gradlew bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name aviation-telegram-bot-bot-commands-processing \
            --zip-file fileb://bot-commands-processing-lambda/build/libs/bot-commands-processing-lambda.jar

      - name: Wait for Lambda Update
        run: |
          aws lambda wait function-updated \
            --function-name aviation-telegram-bot-bot-commands-processing

      - name: Set Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name aviation-telegram-bot-bot-commands-processing \
            --environment "Variables={BOT_TOKEN=${{ secrets.BOT_TOKEN }}}"
