name: Deploy flightradar-api-lambda

on:
  push:
    branches:
      - main
    paths:
      - 'flightradar-api-lambda/**'
      - '.github/workflows/deploy-flightradar-api-lambda.yml'

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip lambda source
        run: |
          cd flightradar-api-lambda
          zip lambda.zip lambda.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name aviation-telegram-bot-flightradar-api \
            --zip-file fileb://flightradar-api-lambda/lambda.zip
