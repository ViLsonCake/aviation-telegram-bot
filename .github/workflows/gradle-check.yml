name: Gradle Check
on:
  pull_request:
    paths:
      - "common-library/**"
      - "bot-commands-processing-lambda/**"
      - "flights-notification-lambda/**"

jobs:
  check:
    name: Gradle Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Spotless Check
        run: ./gradlew spotlessCheck

  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gradle Build
        run: ./gradlew build
