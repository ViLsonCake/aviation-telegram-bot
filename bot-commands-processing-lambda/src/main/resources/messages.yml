templates:
  commands:
    START: |-
        ✈️ *Welcome to Aviation Bot!*

        Provide *ICAO* or *IATA* code of the airport you want to choose.
    PING: |-
        pong
    AIRPORT: |-
        🛬 Current airport information:

        *Name*: _%s_
        *ICAO*: _%s_
        *IATA*: _%s_
        *City*: _%s_
        *Country*: _%s_
    MODE: |-
      ⚙️ Current mode is %s.


      _Modes explanation_

      🔔 *Default*: you'll be notified about the scheduled flights to your airport as well as about the specific aircraft.

      🗓 *Only Scheduled Flights*: you'll be notified only about the scheduled flights to your airport.

      🛩 *Only Specific Aircraft*: you'll be notified only about the specific aircraft. CURRENTLY IN DEVELOPMENT, NOT YET READY FOR USE

      🔕 *Mute*: you won't be notified about any flights.
    AIRCRAFT: |-
      🛩 *Aircraft Filter*

      Current filter: %s

      Controls which aircraft families you receive notifications for.

  user-state-responses:
    CHOOSING_AIRPORT:
        AIRPORT_NOT_FOUND: |-
          ❌ Airport with *ICAO* or *IATA* code %s not found.
        VALID_AIRPORT_SELECTED: |-
          ✅ Great! You have chosen your airport.

          *Name*: _%s_
          *ICAO*: _%s_
          *IATA*: _%s_
          *City*: _%s_
          *Country*: _%s_

  callbacks:
    CHANGE_AIRPORT:
      button-text: |-
        🛬 Change Airport
      message-template: |-
        Provide *ICAO* or *IATA* code of the airport you want to choose.
    CHANGE_BOT_MODE:
      button-text: |-
        ⚙️ Change Mode
      message-template: |-
        Select mode using the buttons below.
      buttons:
        DEFAULT: "🔔 Default"
        ONLY_SCHEDULED_FLIGHTS: "🗓 Only Scheduled Flights"
        ONLY_SPECIFIC_AIRCRAFT: "🛩 Only Specific Aircraft"
        MUTE: "🔕 Mute"
    CHANGE_MODE:
      button-text: ""
      message-template: |-
        ⚙️ Mode changed to *%s*.
    AIRCRAFT_FILTER:
      button-text: |-
        🛩 Manage Aircraft Filter
      message-template: |-
        Select up to 10 aircraft families.
        Families with ✅ will be included in your notifications.
        No selection = all aircraft (default).
    TOGGLE_AIRCRAFT_FAMILY:
      button-text: ""
      message-template: ""
    RESET_AIRCRAFT_FILTER:
      button-text: "🔄 Reset (show all aircraft)"
      message-template: ""
