spring:
  application:
    name: bot-commands-processing-lambda
  config:
    import: classpath:messages.yml
  main:
    web-application-type: none
    lazy-initialization: true
  cloud:
    function:
      definition: botCommandsHandler
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

bot:
  token: ${BOT_TOKEN}
  telegram-api-url: https://api.telegram.org/bot${BOT_TOKEN}/sendMessage
  telegram-api-callback-url: https://api.telegram.org/bot${BOT_TOKEN}/answerCallbackQuery
  telegram-api-media-group-url: https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup

general:
  timezone: Europe/Warsaw