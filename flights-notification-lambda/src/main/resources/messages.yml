templates:
  notifications:
    SINGLE_SCHEDULED_FLIGHT_TITLE: |-
      ⏳ There is a new Scheduled Wide-Body Flight to Your Airport!
    SCHEDULED_FLIGHTS_TITLE: |-
      ⏳ There are *%s* new Scheduled Wide-Body Flights to Your Airport!
    SINGE_SCHEDULED_FLIGHT_DETAILS: |-
      Aircraft: _%s_
      Callsign: _%s_
      Registration: _%s_
      Airline: _%s_
      Origin airport: _%s_
      Status: _%s_
      Arrival time: _%s_
    PLURAL_SCHEDULED_FLIGHT_DETAILS: |-
      *%s. %s*
      Callsign: _%s_
      Registration: _%s_
      Airline: _%s_
      Origin airport: _%s_
      Status: _%s_
      Arrival time: _%s_
