      Callsign: _%s_
      Airline: _%s_
    FLIGHT_ETA_DELAYED_NOTIFICATION: |-
      🟠 ETA delayed by *%s* for a departed Wide-Body Flight to Your Airport
    FLIGHT_ETA_EARLIER_NOTIFICATION: |-
      🟢 Arrival time changed to *%s* earlier for a departed Wide-Body Flight to Your Airport
    FLIGHT_ETA_CHANGED_NOTIFICATION_DETAILS: |-
      Aircraft: _%s_
      Callsign: _%s_
      Scheduled arrival: _%s_
