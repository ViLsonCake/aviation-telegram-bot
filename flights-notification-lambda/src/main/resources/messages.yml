      ✈️ A Wide-Body Flight to Your Airport Has Departed!
    FLIGHT_LIVE_NOTIFICATION_DETAILS: |-
      Aircraft: _%s_
      Callsign: _%s_
      Registration: _%s_
      Airline: _%s_
      Origin airport: _%s_
      Estimated arrival: _%s_
      
      🛩️ [Aircraft info](https://www.flightradar24.com/data/aircraft/%s)

      📍 [View on Flightradar24](https://www.flightradar24.com/%s/%s)
    FLIGHT_DELAYED_NOTIFICATION: |-
      🟠 A Scheduled Wide-Body Flight to Your Airport Is Delayed
    FLIGHT_DELAYED_NOTIFICATION_DETAILS: |-
