plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.github.goooler.shadow' version '8.1.8'
    id 'com.diffplug.spotless' version '7.0.3'
}

ext {
    springCloudVersion = "2025.1.1"
}

group = 'project.vilsoncake'
version = '0.0.1-SNAPSHOT'
description = 'flights-notification-lambda'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.cloud:spring-cloud-function-adapter-aws'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Common library
    implementation 'project.vilsoncake:common-library:1.0-SNAPSHOT'

    // CRaC — enables Spring Boot's SnapStart datasource lifecycle (close pool before checkpoint)
    implementation 'org.crac:crac'

    // AWS
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.4'
    implementation 'software.amazon.awssdk:lambda:2.31.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    enabled = false
}

shadowJar {
    archiveFileName = 'flights-notification-lambda.jar'
    mergeServiceFiles()
    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
    append 'META-INF/spring.factories'
    append 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
    append 'META-INF/spring/org.springframework.boot.env.EnvironmentPostProcessor.imports'
    manifest {
        attributes 'Start-Class': 'project.vilsoncake.flightsnotificationlambda.FlightsNotificationLambdaApplication'
    }
}

spotless {
    java {
        googleJavaFormat('1.25.2')
    }
}
